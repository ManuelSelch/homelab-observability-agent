name: observability-agent

services:
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    pid: host
    environment:
      HOST_NAME: ${HOST_NAME:?Set unique VM name}
      MONITORING_URL: ${MONITORING_URL:?Example http://192.168.178.102}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
